spring.application.name=my-own

spring.datasource.url=jdbc:postgresql://localhost:5434/my_own
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

app.cache.type=redis
app.cache.redis.ttl=10m

spring.data.redis.host=localhost
spring.data.redis.port=6379


# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Сериализация
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties[spring.json.add.type.headers]=false

# Подтверждение отправки
spring.kafka.producer.acks=all

# Повторные попытки
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties[retry.backoff.ms]=100
spring.kafka.producer.properties[retry.backoff.max.ms]=1000

# Идемпотентность
spring.kafka.producer.properties[enable.idempotence]=true

# Таймауты
spring.kafka.producer.properties[request.timeout.ms]=30000
spring.kafka.producer.properties[delivery.timeout.ms]=120000
spring.kafka.producer.properties[max.block.ms]=60000
